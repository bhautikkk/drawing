<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - DrawGo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content-container {
            max-width: 800px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: #333;
            line-height: 1.8;
            text-align: center;
        }

        h1 {
            color: #4b6cb7;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: #4b6cb7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .back-link:hover {
            background: #3a559a;
        }

        .email-link {
            color: #4b6cb7;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .email-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="content-container">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you!</p>
        <p>If you have any questions, feedback, or need support, please don't hesitate to reach out to us.</p>

        <p>Email us at: <a href="mailto:support@drawgo.com" class="email-link">support@drawgo.com</a></p>

        <p>We aim to respond to all inquiries within 48 hours.</p>

        <a href="/" class="back-link">Back to Home</a>
    </div>

</body>

</html>
